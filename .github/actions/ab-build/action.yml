name: A/B benchmark build
description: >-
  Builds nitrolean at one commit as the Mathlib benchmark builds it
  (profile-guided, trained on the repository's exports; with bolt, also
  laid out by BOLT) and uploads the
  binary; see .github/workflows/ab-bench.yml.

inputs:
  sha:
    description: The commit to build
    required: true
  side:
    description: A (base) or B (candidate)
    required: true
  both_sides:
    description: Also upload the base binary as the candidate when both commits match
    default: "false"
  target_cpu:
    description: rustc's -C target-cpu (empty for the default)
    default: ""
  bolt:
    description: Also lay out the code with BOLT (cargo xtask pgo --bolt)
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.sha }}
        path: tgt

    # The Rust toolchain that commit's mise.toml names, with llvm-tools for
    # the profile.
    - name: Install Rust
      shell: bash
      working-directory: tgt
      run: |
        v=$(sed -n 's/^rust = { *version = "\([^"]*\)".*/\1/p; s/^rust = "\([^"]*\)".*/\1/p' mise.toml | head -1)
        test -n "$v"
        command -v rustup >/dev/null || {
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH=$HOME/.cargo/bin:$PATH
        }
        rustup toolchain install "$v" --profile minimal -c llvm-tools
        echo "RUSTUP_TOOLCHAIN=$v" >> "$GITHUB_ENV"

    # LLVM 21's BOLT, from LLVM's own Ubuntu packages.
    - name: Install BOLT
      if: ${{ inputs.bolt == 'true' }}
      shell: bash
      run: |
        . /etc/os-release
        curl -sSfL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
        echo "deb http://apt.llvm.org/$VERSION_CODENAME/ llvm-toolchain-$VERSION_CODENAME-21 main" |
          sudo tee /etc/apt/sources.list.d/llvm-21.list > /dev/null
        sudo apt-get update -q
        sudo apt-get install -y -q bolt-21
        /usr/lib/llvm-21/bin/llvm-bolt --version | head -3

    - name: Build
      shell: bash
      working-directory: tgt
      env:
        CPU: ${{ inputs.target_cpu }}
        BOLT: ${{ inputs.bolt }}
      run: |
        bolt=()
        [ "$BOLT" = true ] && bolt=(--bolt --bolt-dir /usr/lib/llvm-21/bin)
        cargo xtask pgo --repo "${bolt[@]}" --rustflags "${CPU:+-C target-cpu=$CPU}"
        mkdir -p "$RUNNER_TEMP/bin"
        cp target/release/nitrolean "$RUNNER_TEMP/bin/nitrolean"
        "$RUNNER_TEMP/bin/nitrolean" --version
        sha256sum "$RUNNER_TEMP/bin/nitrolean"

    - uses: actions/upload-artifact@v7
      with:
        name: nitrolean-${{ runner.arch }}-${{ inputs.side }}
        path: ${{ runner.temp }}/bin/nitrolean
        retention-days: 7
        if-no-files-found: error

    - uses: actions/upload-artifact@v7
      if: ${{ inputs.both_sides == 'true' }}
      with:
        name: nitrolean-${{ runner.arch }}-B
        path: ${{ runner.temp }}/bin/nitrolean
        retention-days: 7
        if-no-files-found: error

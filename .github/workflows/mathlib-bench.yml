name: Mathlib benchmark

# Checks the NDJSON export of Mathlib v4.36.0 (`cargo xtask mathlib fetch`),
# or its rep25s slice (bench/mathlib/rep25s/), with nitrolean and with
# gruszka, built at the commit the Lean Kernel Arena pins and run as the
# arena runs it (`susz pack --no-index`, then its workers), on a GitHub
# runner: x86_64 (ubuntu-24.04) or aarch64 (ubuntu-24.04-arm), chosen with
# the `runner` input. The runs are nitrolean -j1 and -j4, gruszka with 1 and
# 4 workers, and gruszka alone (4 workers) on the packed file, in rounds:
# within a round the two checkers alternate, so that the runner's noise
# falls on both alike. Each run is measured as the arena measures it
# (bench/mathlib-ci/measure.sh): instructions, wall time, user and system
# CPU time, peak RSS. Every run must accept. The job summary gives the
# medians over the rounds and the ratios nitrolean / gruszka
# (bench/mathlib-ci/report.sh); the artifact holds every row.
#
# hyperfine then times the same commands once more, timing only: one
# warm-up and `hyperfine_runs` runs of each, in two groups (one thread or
# worker, and four), one invocation per group (all runs of a command, then
# the next). Its numbers go into the summary after the rounds'.
#
# Each job reports which instruction counters its machine offers (the
# `probe` job on a machine of its own). GitHub's hosted runners are VMs of
# several kinds: some expose hardware counters (an Intel Xeon 6975P-C on
# KVM did) and some do not (an AMD EPYC 9V74 on Hyper-V did not). With
# them, perf stat counts every run; without them, counts come from
# valgrind's cachegrind: an extra, untimed run in the first round, some 30
# to 70 times slower, taken in auto mode only for a slice. gruszka reserves 128 GiB of
# address space, which valgrind may refuse it; a run that ends differently
# under valgrind gets no count.

on:
  workflow_dispatch:
    inputs:
      slice:
        description: All of Mathlib, or the rep25s slice
        type: choice
        options: [full, rep25s]
        default: full
      lines:
        description: Check only the first N lines of it (a valid export too); empty for all
        default: ""
      counter:
        description: How instructions are counted
        type: choice
        options: [auto, perf, perf-u, cachegrind, none]
        default: auto
      runner:
        description: Runner label (ubuntu-24.04 for x86_64, ubuntu-24.04-arm for aarch64)
        default: ubuntu-24.04
      rounds:
        description: Rounds of runs (medians are taken over them)
        default: "5"
      hyperfine_runs:
        description: Runs of each command for hyperfine (0 to skip it)
        default: "3"
  # On a pull request that changes the benchmark: the rep25s slice.
  pull_request:
    paths:
      - .github/workflows/mathlib-bench.yml
      - bench/mathlib-ci/**
      - bench/mathlib/rep25s/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.runner || 'ubuntu-24.04' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ELAN_VERSION: v4.4.0
  ELAN_SHA256: 0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2
  ELAN_SHA256_AARCH64: 45cde3006f82f98804c94cf2ca4949d117060a5f3cc8afa62f523759947ee21f
  LEAN_TOOLCHAIN: leanprover/lean4:v4.36.0
  # gruszka as the arena's checkers/gruszka.yaml builds it (arena commit
  # 8a7d0dceea76dfe6fd7bd7f3a6ea216f6347c6aa).
  GRUSZKA_URL: https://github.com/jasisz/gruszka
  GRUSZKA_TAG: v0.2.0
  GRUSZKA_REV: 39d03331823f084a39323998fb1ee73de374182e
  SUSZ_VERSION: 0.4.0
  INIT_SUSZ_URL: https://huggingface.co/datasets/jasisz/susz/resolve/108beeec4e2524eeee237330ec6dd99ee2e50216/susz-0.1/init.susz
  INIT_SUSZ_SHA256: b775c241147ff359c4b50aceef2f47282dad9123ecb9f39e28b3c4db21d638d4

jobs:
  probe:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Try the counters
        run: bench/mathlib-ci/probe.sh "$RUNNER_TEMP/counter" | tee -a "$GITHUB_STEP_SUMMARY"

  bench:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space and add swap
        run: |
          echo "W=$HOME/bench" >> "$GITHUB_ENV"
          W=$HOME/bench
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null && sudo swapon /swapfile
          mkdir -p "$W"
          df -h / | tail -1; free -g

      - name: Pick the instruction counter
        env:
          WANTED: ${{ inputs.counter || 'auto' }}
          SLICE: ${{ inputs.slice || 'rep25s' }}
          LINES_WANTED: ${{ inputs.lines }}
        run: |
          bench/mathlib-ci/probe.sh "$RUNNER_TEMP/counter" > "$RUNNER_TEMP/probe.md"
          cat "$RUNNER_TEMP/probe.md"
          counter=$(cat "$RUNNER_TEMP/counter")
          [ "$WANTED" = auto ] || counter=$WANTED
          # Under cachegrind a full Mathlib run would not end within the
          # job's time limit: auto takes it only for a slice.
          if [ "$WANTED" = auto ] && [ "$counter" = cachegrind ] && [ "$SLICE" = full ] && [ -z "$LINES_WANTED" ]; then
            counter=none
          fi
          # valgrind runs neither AVX-512 nor SVE code: under cachegrind,
          # build for x86-64-v3 or generic aarch64 instead of the machine's
          # own instruction set.
          flags="-C target-cpu=native"
          if [ "$counter" = cachegrind ]; then
            case $(uname -m) in x86_64) flags="-C target-cpu=x86-64-v3" ;; *) flags= ;; esac
          fi
          echo "COUNTER=$counter" >> "$GITHUB_ENV"
          echo "FLAGS=$flags" >> "$GITHUB_ENV"
          echo "counter: $counter; rustc flags: $flags"

      - uses: jdx/mise-action@v5

      - name: Add llvm-tools
        run: rustup component add llvm-tools --toolchain "$(rustc --version | cut -d' ' -f2)"

      # Profile-guided, trained on the exports in the repository, as for the
      # arena (bench/arena/nitrolean.yaml).
      - name: Build nitrolean
        run: |
          cargo xtask pgo --repo --rustflags "$FLAGS"
          target/release/nitrolean --version

      # As the arena's checkers/gruszka.yaml: susz from crates.io, gruszka
      # built with its own PGO script, trained on Init.
      - name: Build gruszka
        run: |
          eval "$(mise -C "$GITHUB_WORKSPACE" env)"  # the same Rust toolchain
          git clone -q --depth 1 --branch "$GRUSZKA_TAG" "$GRUSZKA_URL" "$W/gruszka" && cd "$W/gruszka"
          test "$(git rev-parse HEAD)" = "$GRUSZKA_REV"
          RUSTFLAGS="$FLAGS" cargo install susz --version "$SUSZ_VERSION" --locked --root "$PWD/.susz"
          curl -sSfL -o init.susz "$INIT_SUSZ_URL"
          echo "$INIT_SUSZ_SHA256  init.susz" | sha256sum -c
          FLAGS="$FLAGS" scripts/build-pgo.sh "$PWD/init.susz"
          rm -f init.susz
          rm -rf target/pgo

      - name: Install elan and Lean
        run: cargo xtask install-elan --toolchain "$LEAN_TOOLCHAIN"

      # Checked against the export's SHA-256; Mathlib's checkout and build
      # cache are removed afterwards for disk space.
      - name: Fetch the Mathlib export
        env:
          SLICE: ${{ inputs.slice || 'rep25s' }}
        run: |
          if [ "$SLICE" = rep25s ]; then
            time bench/mathlib/rep25s/build.sh "$W/mathlib4" "$W/mathlib.ndjson"
          else
            time cargo xtask mathlib fetch "$W/mathlib.ndjson"
          fi
          rm -rf "$W/mathlib4" ~/.cache/mathlib
          df -h / | tail -1

      - name: Take the slice
        env:
          SLICE: ${{ inputs.slice || 'rep25s' }}
          LINES_WANTED: ${{ inputs.lines }}
        run: |
          in=$W/mathlib.ndjson
          if [ -n "$LINES_WANTED" ]; then
            head -n "$LINES_WANTED" "$in" > "$W/slice.ndjson"
            rm "$in"
            in=$W/slice.ndjson
          fi
          echo "IN=$in" >> "$GITHUB_ENV"
          {
            echo "export: Mathlib v4.36.0, $([ "$SLICE" = full ] && echo all of it || echo "the $SLICE slice"), ${LINES_WANTED:-all} lines"
            echo "($(wc -l < "$in") lines, $(stat -c %s "$in") bytes, SHA-256 \`$(sha256sum "$in" | cut -d' ' -f1)\`)"
          } | tee "$RUNNER_TEMP/input.md"

      - name: Pack it for gruszka alone
        run: |
          time "$W/gruszka/.susz/bin/susz" pack --no-index "$IN" "$W/in.susz"
          ls -l "$W/in.susz"

      # Round by round, nitrolean and gruszka alternate. Under cachegrind
      # only the first round counts (an extra run each); perf counts every
      # run.
      - name: Run
        env:
          ROUNDS: ${{ inputs.rounds || '5' }}
        run: |
          out=$RUNNER_TEMP/mathlib-bench.tsv
          m=$PWD/bench/mathlib-ci/measure.sh
          nl=$PWD/target/release/nitrolean
          gr() { (cd "$W/gruszka" && TMPDIR=$W "$m" "$@"); }
          warm() { cat "$IN" "$W/in.susz" > /dev/null; }
          counter=$COUNTER
          for ROUND in $(seq "$ROUNDS"); do
            export ROUND
            if [ "$ROUND" -gt 1 ] && [ "$counter" = cachegrind ]; then export COUNTER=none; fi
            warm; $m "nitrolean -j1" "$out" "$nl check -j 1 '$IN'"
            warm; gr "gruszka (susz pack + 1 worker)" "$out" "scripts/arena-run '$IN' 1"
            warm; $m "nitrolean -j4" "$out" "$nl check -j 4 '$IN'"
            warm; gr "gruszka (susz pack + 4 workers)" "$out" "scripts/arena-run '$IN' 4"
            warm; $m "gruszka alone (4 workers)" "$out" "'$W/gruszka/target/release/gruszka' '$W/in.susz' 4"
          done

      # Timing only, after the rounds.
      - name: Time with hyperfine
        if: ${{ (inputs.hyperfine_runs || '3') != '0' }}
        env:
          RUNS: ${{ inputs.hyperfine_runs || '3' }}
        run: |
          # A pinned hyperfine: the summary reads its JSON.
          cargo install hyperfine --version 1.18.0 --locked --root "$W/hyperfine"
          export PATH=$W/hyperfine/bin:$PATH
          nl=$PWD/target/release/nitrolean
          g="env TMPDIR='$W' '$W/gruszka/scripts/arena-run' '$IN'"
          hyperfine --warmup 1 --runs "$RUNS" --style basic \
            --export-markdown "$RUNNER_TEMP/hyperfine-1.md" --export-json "$RUNNER_TEMP/hyperfine-1.json" \
            -n "nitrolean -j1" "$nl check -j 1 '$IN'" \
            -n "gruszka (susz pack + 1 worker)" "$g 1"
          hyperfine --warmup 1 --runs "$RUNS" --style basic \
            --export-markdown "$RUNNER_TEMP/hyperfine-4.md" --export-json "$RUNNER_TEMP/hyperfine-4.json" \
            -n "nitrolean -j4" "$nl check -j 4 '$IN'" \
            -n "gruszka (susz pack + 4 workers)" "$g 4" \
            -n "gruszka alone (4 workers)" "'$W/gruszka/target/release/gruszka' '$W/in.susz' 4"

      - name: Report
        if: always()
        run: |
          out=$RUNNER_TEMP/mathlib-bench.tsv
          [ -f "$out" ] || exit 1
          ok=0
          {
            echo "## Mathlib v4.36.0 on $(uname -m) ($RUNNER_LABEL)"
            echo
            cat "$RUNNER_TEMP/input.md"
            echo
            echo "nitrolean \`$(git rev-parse --short HEAD)\`, gruszka \`${GRUSZKA_REV:0:12}\`, susz $SUSZ_VERSION;"
            echo "rustc flags \`${FLAGS:-(none)}\`, both PGO; instructions by \`$COUNTER\`."
            echo
            bench/mathlib-ci/report.sh "$out" || ok=$?
            echo
            if ls "$RUNNER_TEMP"/hyperfine-*.json > /dev/null 2>&1; then
              echo "### hyperfine (wall time only)"
              echo
              echo "Relative: the median over the smallest median of its group."
              echo
              echo "| command | runs | mean s | ± σ | median s | min s | max s | relative |"
              echo "|---|--:|--:|--:|--:|--:|--:|--:|"
              for f in "$RUNNER_TEMP"/hyperfine-*.json; do
                jq -r '(.results | map(.median) | min) as $best | .results[] |
                  "| \(.command) | \(.times | length) | \(.mean * 1000 | round / 1000) | \(.stddev * 1000 | round / 1000) | \(.median * 1000 | round / 1000) | \(.min * 1000 | round / 1000) | \(.max * 1000 | round / 1000) | \(.median / $best * 1000 | round / 1000) |"' "$f"
              done
              echo
            fi
            cat "$RUNNER_TEMP/probe.md"
          } > "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$ok"
        env:
          RUNNER_LABEL: ${{ inputs.runner || 'ubuntu-24.04' }}

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mathlib-bench-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/mathlib-bench.tsv
            ${{ runner.temp }}/hyperfine-*.json
            ${{ runner.temp }}/hyperfine-*.md
            ${{ runner.temp }}/summary.md
            ${{ runner.temp }}/probe.md
            ${{ runner.temp }}/input.md
          if-no-files-found: ignore

name: Corpus

# Runs nitrolean on the kernel-checker test corpus (see corpus/SOURCES.md) and
# compares its verdicts with corpus/expected-nitrolean.tsv.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_ENV: corpus
  ELAN_VERSION: v4.4.0
  ELAN_SHA256: 0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2
  LEAN_TOOLCHAIN: leanprover/lean4:v4.36.0

jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Self-check
        run: scripts/selfcheck.sh

      - name: Cache the corpus
        id: corpus-cache
        uses: actions/cache@v6
        with:
          path: corpus/exports
          key: corpus-${{ hashFiles('scripts/fetch-corpus.sh', 'scripts/corpus.py', 'corpus/lean/**', 'corpus/exports.sha256') }}

      - name: Cache elan and Lean
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ env.ELAN_VERSION }}-${{ env.LEAN_TOOLCHAIN }}-${{ runner.os }}-${{ runner.arch }}

      - name: Cache uv
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('scripts/fetch-corpus.sh') }}

      - name: Install elan
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: |
          if [ ! -x ~/.elan/bin/elan ]; then
            curl -sSfL -o /tmp/elan.tar.gz \
              "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/elan-x86_64-unknown-linux-gnu.tar.gz"
            echo "$ELAN_SHA256  /tmp/elan.tar.gz" | sha256sum -c -
            tar -xzf /tmp/elan.tar.gz -C /tmp
            /tmp/elan-init -y --no-modify-path --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the corpus
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: time scripts/fetch-corpus.sh

      - name: Check the cached corpus
        if: steps.corpus-cache.outputs.cache-hit == 'true'
        run: python3 -I scripts/corpus.py checksums corpus/exports --check corpus/exports.sha256

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'mise.toml') }}

      - name: Install GNU time
        run: test -x /usr/bin/time || { sudo apt-get update -q && sudo apt-get install -yq time; }

      - name: Build nitrolean
        run: cargo build --release --locked

      # Every export the reader should be able to read must parse.
      - name: Parse the corpus
        run: python3 -I scripts/run-corpus.py --parse-only -q --results corpus-parse.tsv

      # Allowed to fail until the checker exists; set the repository variable
      # CORPUS_REQUIRED to true to make it count.
      - name: Run the corpus
        continue-on-error: ${{ vars.CORPUS_REQUIRED != 'true' }}
        run: python3 -I scripts/run-corpus.py --results corpus-results.tsv

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corpus-results
          path: |
            corpus-parse.tsv
            corpus-results.tsv
          if-no-files-found: ignore

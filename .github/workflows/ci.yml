name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      # Nothing private in the tree or in the new commits' messages.
      - name: Public-content check
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            cargo xtask public-check "$PR_BASE..$PR_HEAD"
          elif [ -n "${BEFORE//0/}" ] && git cat-file -e "$BEFORE^{commit}"; then
            cargo xtask public-check "$BEFORE..$AFTER"
          else
            cargo xtask public-check "$AFTER"
          fi
      - name: Public-content check self-test
        run: cargo xtask public-check-test
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --workspace -- -D warnings
      - name: Test
        run: cargo test --workspace

[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
description = "The repository's tooling: cargo xtask <command>"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
regex = "1"
serde_json = "1"
sha2 = "0.11.1"

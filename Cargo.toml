[package]
name = "nitrolean"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.100"
description = "Independent Lean 4 proof checker in Rust, focused on speed and low memory use"
license = "Apache-2.0"
repository = "https://github.com/6/nitrolean"
readme = "README.md"
keywords = ["lean", "proof-checker", "kernel"]
categories = ["command-line-utilities", "mathematics"]
include = ["/src/**/*.rs", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/NOTICE", "/README.md"]

[lib]
name = "nitrolean"
path = "src/lib.rs"

[[bin]]
name = "nitrolean"
path = "src/main.rs"

[[bin]]
name = "nlean"
path = "src/bin/nlean.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
hashbrown = "0.17"
memmap2 = "0.9"
libmimalloc-sys = { version = "0.1.49", default-features = false }
num-bigint = "0.5"
sha2 = "0.11.1"
stacker = "0.1"

# The repository's tooling (`cargo xtask <command>`, see xtask/README.md); not
# part of the published crate.
[workspace]
members = ["xtask"]

# One codegen unit and whole-program (fat) LTO: the checker's hot loops cross
# modules, and inlining across them is worth the longer build.
[profile.release]
lto = "fat"
codegen-units = 1

# The tooling, built quickly (see .cargo/config.toml).
[profile.xtask]
inherits = "release"
lto = false
codegen-units = 16

[package]
name = "leanqk"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
description = "Lean quick kernel"
license = "MIT"
repository = "https://github.com/6/leanqk"
readme = "README.md"
keywords = ["lean", "proof-checker", "kernel"]
categories = ["command-line-utilities", "mathematics"]
exclude = [".github/", "mise.toml"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "leanqk"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
